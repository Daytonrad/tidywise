[project]
name = "tidywise"
version = "0.4.0"
description = "Sort loose files on a Mac with a local AI model (Ollama) and make them findable for agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pypdf>=4"]

[project.scripts]
tidywise = "tidywise.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tidywise"]

[tool.setuptools.package-data]
tidywise = ["default_config.toml"]
